<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPAR: Choreo</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="spreadsheet.css">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <img src="BB_logo.png" class="logo" alt="Company Logo">
    </div>

    <div class="header-center">
      <h2>SPAR</h2>
    </div>
    <div class="header-right">
      <button class="primary" onclick="exportTable()">Export</button>
    </div>
  </header>

  <div class="spreadsheet-container">
    <table id="spreadsheetTable" contenteditable="true"></table>
  </div>

  <div class="spreadsheet-container buttons-row">
    <button class="secondary" onclick="addBreak()">+ Break</button>
    <button class="secondary" onclick="addRow()">+ Row</button>
  </div>

<!-- Load ExcelJS (needed for your new exportSpreadsheet) -->
<script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
<!-- load html2canvas + jsPDF for table exporting -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>



<!-- load all js -->
<script src="SPARconfig.js"></script>
<script src="spreadsheet.js"></script>

</body>
</html>
